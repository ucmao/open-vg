services:
  db:
    image: postgres:15-alpine
    container_name: vidgen-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vidgen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vidgen"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vidgen-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidgen-backend
    restart: always
    command: >
      sh -c "python scripts/seed_all.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=development
      - RETURN_VERIFICATION_CODES=${RETURN_VERIFICATION_CODES:-false}
      - JWT_SECRET=${JWT_SECRET:-local-development-only-jwt-secret}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:-local-development-only-config-key}
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/vidgen
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_FRONTEND_URL=http://localhost:3001
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-admin}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidgen-celery-worker
    restart: always
    command: celery -A app.celery_app worker --loglevel=info -c 4
    environment:
      - ENVIRONMENT=development
      - JWT_SECRET=${JWT_SECRET:-local-development-only-jwt-secret}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:-local-development-only-config-key}
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/vidgen
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - REPLICATE_API_KEY=${REPLICATE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: vidgen-web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NUXT_INTERNAL_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: vidgen-admin
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
