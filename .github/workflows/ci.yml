name: VidGen CI Quality Gate

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Code Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip check

      - name: Full Python Compile Verification
        run: |
          python -m compileall -q backend/app backend/scripts

      - name: Run Backend Unit Tests
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  web-checks:
    name: Web Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.15'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run ESLint
        working-directory: web
        run: npm run lint

      - name: Run TypeScript Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Run Unit Tests
        working-directory: web
        run: npm test

      - name: Build Web Application
        working-directory: web
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: http://localhost:8000

  admin-checks:
    name: Admin Dashboard Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.15'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Run ESLint
        working-directory: admin
        run: npm run lint

      - name: Run TypeScript Typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Run Unit Tests
        working-directory: admin
        run: npm test

      - name: Build Admin Application
        working-directory: admin
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: http://localhost:8000
